<style>
  :root {
    --fundo: #f5f6f8; --superficie: #ffffff; --texto: #1d2430; --mudo: #5d6878; --borda: #dde2e8;
    --primaria: #1f3a5f; --primaria-texto: #ffffff; --destaque: #e8eef6;
    --ok: #1e7a46; --alerta: #a35d00; --erro: #b42318;
    --raio: 10px; --sombra: 0 1px 2px rgba(16, 24, 40, .06);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fundo: #12161c; --superficie: #1b2129; --texto: #e7ebf0; --mudo: #9aa5b4; --borda: #2c3542;
      --primaria: #8fb3e3; --primaria-texto: #0d1420; --destaque: #233042;
      --ok: #5cc98a; --alerta: #f0b35a; --erro: #ff8a80;
    }
  }
  :root[data-theme="dark"] {
    --fundo: #12161c; --superficie: #1b2129; --texto: #e7ebf0; --mudo: #9aa5b4; --borda: #2c3542;
    --primaria: #8fb3e3; --primaria-texto: #0d1420; --destaque: #233042;
    --ok: #5cc98a; --alerta: #f0b35a; --erro: #ff8a80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--fundo); color: var(--texto); font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .topo { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--superficie); border-bottom: 1px solid var(--borda); position: sticky; top: 0; z-index: 5; }
  .marca { white-space: nowrap; }
  .busca { flex: 1; min-width: 0; }
  .busca input { width: 100%; padding: 8px 12px; border: 1px solid var(--borda); border-radius: 8px; background: var(--fundo); color: var(--texto); font: inherit; }
  .usuario { font-size: 13px; color: var(--mudo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  .menu-botao { display: none; border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); border-radius: 8px; padding: 4px 10px; font-size: 18px; }
  .corpo { flex: 1; display: flex; min-height: 0; }
  .lateral { width: 240px; flex-shrink: 0; padding: 12px 8px; border-right: 1px solid var(--borda); background: var(--superficie); }
  .lateral a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--texto); text-decoration: none; font-size: 14px; }
  .lateral a:hover { background: var(--destaque); }
  .lateral a[aria-current="page"] { background: var(--primaria); color: var(--primaria-texto); }
  .lateral .fase { font-size: 11px; opacity: .7; }
  .conteudo { flex: 1; min-width: 0; padding: 20px 24px; outline: none; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitulo { color: var(--mudo); margin: 0 0 20px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .cartao { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); padding: 14px 16px; box-shadow: var(--sombra); }
  .cartao .rotulo { color: var(--mudo); font-size: 13px; }
  .cartao .valor { font-size: 24px; font-weight: 600; margin-top: 2px; }
  .tabela-envoltorio { overflow-x: auto; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--borda); }
  th { color: var(--mudo); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  .selo { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid currentColor; white-space: nowrap; }
  .selo.ok { color: var(--ok); } .selo.alerta { color: var(--alerta); } .selo.erro { color: var(--erro); }
  .mudo { color: var(--mudo); }
  .aviso { border-left: 4px solid var(--alerta); background: var(--superficie); padding: 12px 14px; border-radius: 6px; margin-bottom: 16px; }
  .erro-caixa { border-left: 4px solid var(--erro); background: var(--superficie); padding: 12px 14px; border-radius: 6px; }
  .rodape { color: var(--mudo); font-size: 12px; padding: 8px 16px; border-top: 1px solid var(--borda); background: var(--superficie); }
  @media (max-width: 800px) {
    .menu-botao { display: inline-block; }
    .usuario { display: none; }
    .lateral { position: fixed; top: 53px; left: 0; bottom: 0; z-index: 4; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--sombra); overflow-y: auto; }
    .lateral.aberta { transform: none; }
    .conteudo { padding: 16px; }
  }

  /* ---- componentes da Fase 3 ---- */
  .barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .barra input[type=search], .barra select { border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); border-radius: 8px; padding: 7px 10px; font: inherit; min-width: 0; }
  .barra input[type=search] { flex: 1 1 200px; max-width: 320px; }
  .espaco { flex: 1; }
  .botao { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); border-radius: 8px; padding: 7px 12px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .botao:hover { border-color: var(--mudo); }
  .botao.primario { background: var(--primaria); border-color: var(--primaria); color: var(--primaria-texto); }
  .botao.perigo { color: var(--erro); }
  .botao[disabled] { opacity: .5; cursor: not-allowed; }
  .abas { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--destaque); border-radius: 10px; margin-bottom: 12px; }
  .aba { border: 0; background: transparent; color: var(--texto); padding: 6px 10px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .aba b { color: var(--mudo); font-weight: 600; margin-left: 4px; }
  .aba[aria-selected="true"] { background: var(--superficie); box-shadow: var(--sombra); }
  .totais { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--mudo); margin-bottom: 10px; }
  .totais strong { color: var(--texto); }
  tbody tr.clicavel { cursor: pointer; }
  tbody tr.clicavel:hover td { background: var(--destaque); }
  .placa { display: inline-block; font-weight: 700; letter-spacing: .06em; font-size: 13px; border: 1.5px solid currentColor; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .selo.info { color: var(--primaria); } .selo.mudo { color: var(--mudo); }
  td small, .sub { display: block; color: var(--mudo); font-size: 12px; }
  .gaveta { position: fixed; inset: 0; z-index: 40; }
  .veu { position: absolute; inset: 0; background: rgba(8, 12, 18, .45); }
  .painel-gaveta { position: absolute; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--superficie); box-shadow: var(--sombra); display: flex; flex-direction: column; outline: none; }
  .gaveta-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 20px 12px; border-bottom: 1px solid var(--borda); }
  .gaveta-topo h2 { margin: 0; font-size: 20px; }
  .gaveta-corpo { flex: 1; overflow-y: auto; padding: 16px 20px 24px; display: grid; gap: 18px; align-content: start; }
  .gaveta-rodape { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--borda); background: var(--fundo); }
  .fechar { border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); border-radius: 8px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; flex: none; }
  .secao h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--mudo); }
  .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin: 0; }
  .kv dt { font-size: 12px; color: var(--mudo); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
  .campo { display: grid; gap: 4px; min-width: 0; }
  .campo.inteiro { grid-column: 1 / -1; }
  .campo > span { font-size: 12px; font-weight: 600; color: var(--mudo); }
  .campo input, .campo select, .campo textarea { width: 100%; border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); border-radius: 8px; padding: 8px 10px; font: inherit; min-width: 0; }
  .campo textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .campo .dica { font-size: 12px; color: var(--mudo); margin: 0; }
  .campo .dica.erro { color: var(--erro); } .campo .dica.ok { color: var(--ok); }
  .opcoes { display: grid; gap: 6px; } .opcoes label { display: flex; gap: 8px; align-items: flex-start; }
  .lista-simples { list-style: none; margin: 0; padding: 0; border: 1px solid var(--borda); border-radius: 8px; overflow: hidden; }
  .lista-simples li { padding: 8px 12px; border-top: 1px solid var(--borda); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .lista-simples li:first-child { border-top: 0; }
  .caixa { border-radius: 8px; padding: 10px 12px; background: var(--destaque); }
  .caixa.erro { border-left: 4px solid var(--erro); } .caixa.alerta { border-left: 4px solid var(--alerta); } .caixa.ok { border-left: 4px solid var(--ok); }
  .aviso-flutuante { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--texto); color: var(--fundo); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); }
  @media (max-width: 560px) { .form, .kv { grid-template-columns: minmax(0, 1fr); } }
</style>
