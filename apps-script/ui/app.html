<script>
  (function () {
    'use strict';

    // Telas do painel (prompt §7). `perfis` vazio = todos os perfis cadastrados.
    var TELAS = [
      { id: 'visao-geral', titulo: '🏠 Visão Geral', fase: '4', perfis: [] },
      { id: 'agenda', titulo: '📅 Agenda', fase: '4', perfis: [] },
      { id: 'ipva-licenciamento', titulo: '🧾 IPVA & Licenciamento', fase: '3', perfis: [], pronta: true },
      { id: 'multas', titulo: '🚨 Multas', fase: '5', perfis: [] },
      { id: 'motoristas', titulo: '👷 Motoristas', fase: '6', perfis: ['ADMIN', 'FINANCEIRO', 'DP'] },
      { id: 'folha', titulo: '💼 Folha do mês', fase: '6', perfis: ['ADMIN', 'FINANCEIRO', 'DP'] },
      { id: 'veiculos', titulo: '🚛 Veículos', fase: '3', perfis: [], pronta: true },
      { id: 'locatarios', titulo: '🤝 Locatários & Repasses', fase: '8', perfis: [] },
      { id: 'custos', titulo: '📊 Custos & Gerencial', fase: '4', perfis: [] },
      { id: 'revisao', titulo: '📥 Fila de Revisão', fase: '5', perfis: ['ADMIN', 'FINANCEIRO'] },
      { id: 'admin', titulo: '⚙️ Admin', fase: '1', perfis: ['ADMIN'], pronta: true }
    ];

    var ROTULOS = {
      STATUS: { PREVISTO: 'Previsto', GUIA_DISPONIVEL: 'Guia disponível', LANCADO_ERP: 'Lançado no ERP', PAGO: 'Pago', PAGO_SEM_LANCAMENTO: 'Pago sem lançamento', ISENTO: 'Isento', NAO_APLICA: 'Não se aplica', CANCELADO: 'Cancelado', BLOQUEADO: 'Bloqueado' },
      PRAZO: { VENCIDO: ['Vencido', 'erro'], VENCE_HOJE: ['Vence hoje', 'erro'], VENCE_EM_7_DIAS: ['Vence em breve', 'alerta'], EM_DIA: ['Em dia', 'mudo'] },
      IPVA: { QUITADO: ['IPVA quitado', 'ok'], EM_DIA: ['IPVA em dia', 'info'], VENCIDO: ['IPVA vencido', 'erro'], ISENTO: ['Isento', 'mudo'], NAO_GERADO: ['Sem IPVA', 'mudo'] },
      LIC: { LICENCIADO: ['Licenciado', 'ok'], QUITADO_SEM_CRLV: ['Pago, falta CRLV', 'alerta'], EM_DIA: ['A licenciar', 'info'], VENCIDO: ['Licenc. vencido', 'erro'], NAO_GERADO: ['Não gerado', 'mudo'] },
      FILAS: [['TODAS', 'Todas'], ['A_LANCAR_ERP', 'A lançar no ERP'], ['PAGO_SEM_LANCAMENTO', 'Pagos sem lançamento'], ['VENCIDOS', 'Vencidos'], ['BLOQUEADOS', 'Bloqueados'], ['SEM_ESTIMATIVA', 'Sem estimativa']],
      SITUACAO: { OPERACAO_PROPRIA: 'Operação própria', LOCADO_TERCEIRO: 'Locado', PARADO: 'Parado', A_VENDA: 'À venda', VENDIDO: 'Vendido', BAIXADO: 'Baixado', EM_TRANSFERENCIA: 'Em transferência', HISTORICO: 'Histórico' }
    };

    var estado = { perfil: null, eu: null, veic: null, obr: null, filtrosVeic: { q: '', uf: '', filial: '', tipo: '', situacao: '', alerta: '' }, filtrosObr: { fila: 'TODAS', q: '', tributo: '', uf: '', filial: '', mes: '' } };

    // ------------------------------------------------------------ utilidades
    function el(tag, atributos, filhos) {
      var e = document.createElement(tag);
      Object.keys(atributos || {}).forEach(function (k) {
        var v = atributos[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'texto') e.textContent = v;
        else if (k === 'classe') e.className = v;
        else if (k.indexOf('on') === 0 && typeof v === 'function') e.addEventListener(k.slice(2), v);
        else if (k === 'valor') e.value = v;
        else e.setAttribute(k, v === true ? '' : v);
      });
      (filhos || []).forEach(function (f) { if (f !== null && f !== undefined && f !== false) e.appendChild(typeof f === 'string' ? document.createTextNode(f) : f); });
      return e;
    }
    function chamar(rota, args) {
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(function (r) { (r && r.ok) ? resolve(r.dados) : reject(new Error(r ? r.erro : 'Sem resposta do servidor')); })
          .withFailureHandler(function (e) { reject(e instanceof Error ? e : new Error(String(e))); })
          .api(rota, args || {});
      });
    }
    function numeroBR(n) { return n === null || n === undefined ? '—' : Number(n).toLocaleString('pt-BR'); }
    function moeda(n) { return n === null || n === undefined || n === '' ? '—' : Core.moeda.formatarMoeda(n); }
    function dataBR(iso) { return iso ? Core.datas.dataBR(String(iso).slice(0, 10)) : '—'; }
    function selo(par) { return el('span', { classe: 'selo ' + par[1], texto: par[0] }); }
    function placa(p) { return el('span', { classe: 'placa', texto: Core.placa.formatarPlaca(p) }); }
    function podeEditar() { return estado.perfil === 'ADMIN' || estado.perfil === 'FINANCEIRO'; }
    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.hidden = false;
      clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 4000);
    }
    function conteudo() { var c = document.getElementById('conteudo'); c.innerHTML = ''; return c; }
    function mostrarErro(mensagem, alvo) {
      var c = alvo || conteudo();
      c.appendChild(el('div', { classe: 'erro-caixa' }, [el('strong', { texto: 'Não foi possível concluir. ' }), document.createTextNode(mensagem)]));
    }
    function carregando(c, txt) { c.appendChild(el('p', { classe: 'mudo', texto: txt || 'Carregando…' })); }
    function opcoes(select, lista, atual) {
      lista.forEach(function (o) {
        var valor = Array.isArray(o) ? o[0] : o, rotulo = Array.isArray(o) ? o[1] : o;
        var op = el('option', { value: valor, texto: rotulo });
        if (String(valor) === String(atual || '')) op.selected = true;
        select.appendChild(op);
      });
      return select;
    }
    function semAcento(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
    function baixar(nome, texto) {
      try {
        var blob = new Blob(['﻿' + texto], { type: 'text/csv;charset=utf-8' });
        var a = el('a', { href: URL.createObjectURL(blob), download: nome });
        document.body.appendChild(a); a.click(); a.remove();
        toast('Arquivo ' + nome + ' gerado');
      } catch (e) {
        var ta = el('textarea', { readonly: true, style: 'width:100%;min-height:300px' }); ta.value = texto;
        abrirGaveta('Copie o CSV', nome, el('div', {}, [el('p', { classe: 'mudo', texto: 'O navegador não permitiu baixar. Copie o conteúdo abaixo.' }), ta]), []);
      }
    }

    // ------------------------------------------------------------ gaveta
    function abrirGaveta(titulo, subtitulo, corpo, botoes) {
      var g = document.getElementById('gaveta'), p = document.getElementById('painelGaveta');
      p.innerHTML = '';
      p.appendChild(el('div', { classe: 'gaveta-topo' }, [
        el('div', {}, [el('h2', { texto: titulo }), subtitulo ? el('div', { classe: 'mudo', texto: subtitulo }) : null]),
        el('button', { classe: 'fechar', 'aria-label': 'Fechar', texto: '×', onclick: fecharGaveta })
      ]));
      p.appendChild(el('div', { classe: 'gaveta-corpo' }, [corpo]));
      if (botoes && botoes.length) p.appendChild(el('div', { classe: 'gaveta-rodape' }, botoes));
      g.hidden = false; p.focus();
    }
    function fecharGaveta() { document.getElementById('gaveta').hidden = true; }
    document.getElementById('gaveta').addEventListener('click', function (e) { if (e.target.getAttribute('data-fechar')) fecharGaveta(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharGaveta(); });

    function campo(rotulo, controle, dica, inteiro) {
      return el('label', { classe: 'campo' + (inteiro ? ' inteiro' : '') }, [el('span', { texto: rotulo }), controle, dica || null]);
    }
    function entrada(nome, valor, extra) { return el('input', Object.assign({ name: nome, valor: valor === null || valor === undefined ? '' : String(valor) }, extra || {})); }
    function valoresDoForm(form) {
      var r = {};
      Array.prototype.forEach.call(form.querySelectorAll('[name]'), function (c) {
        if (c.type === 'radio') { if (c.checked) r[c.name] = c.value; return; }
        if (c.type === 'checkbox') { r[c.name] = c.checked ? 'S' : 'N'; return; }
        r[c.name] = c.value;
      });
      return r;
    }

    // ------------------------------------------------------------ menu e rotas
    function telasPermitidas() { return TELAS.filter(function (t) { return !t.perfis.length || t.perfis.indexOf(estado.perfil) >= 0; }); }
    function montarMenu(atual) {
      var nav = document.getElementById('lateral'); nav.innerHTML = '';
      telasPermitidas().forEach(function (t) {
        var a = el('a', { href: '#/' + t.id }, [el('span', { texto: t.titulo }), t.pronta ? null : el('span', { classe: 'fase', texto: 'F' + t.fase })]);
        if (t.id === atual) a.setAttribute('aria-current', 'page');
        nav.appendChild(a);
      });
    }
    function telaEmConstrucao(t) {
      var c = conteudo();
      c.appendChild(el('h1', { texto: t.titulo }));
      c.appendChild(el('p', { classe: 'subtitulo', texto: 'Esta tela chega na Fase ' + t.fase + ' do projeto.' }));
    }

    // ------------------------------------------------------------ visão geral e admin
    function telaVisaoGeral() {
      var c = conteudo();
      c.appendChild(el('h1', { texto: '🏠 Visão Geral' }));
      c.appendChild(el('p', { classe: 'subtitulo', texto: 'Hoje é ' + dataBR(estado.eu.hoje) + '. Os indicadores completos chegam na Fase 4.' }));
      var grade = el('div', { classe: 'grade' }); c.appendChild(grade);
      chamar('statusBase').then(function (d) {
        var mapa = {}; d.tabelas.forEach(function (t) { mapa[t.nome] = t.registros; });
        [['Veículos', 'VEICULOS', '#/veiculos'], ['Obrigações', 'OBRIGACOES', '#/ipva-licenciamento'], ['Locações', 'LOCACOES', null], ['Filiais', 'FILIAIS', null]].forEach(function (p) {
          var cartao = el('div', { classe: 'cartao' }, [el('div', { classe: 'rotulo', texto: p[0] }), el('div', { classe: 'valor', texto: numeroBR(mapa[p[1]]) })]);
          grade.appendChild(p[2] ? el('a', { href: p[2], style: 'text-decoration:none;color:inherit' }, [cartao]) : cartao);
        });
      }).catch(function (e) { mostrarErro(e.message); });
    }
    function telaAdmin() {
      var c = conteudo();
      c.appendChild(el('h1', { texto: '⚙️ Admin' }));
      c.appendChild(el('p', { classe: 'subtitulo', texto: 'Estado das tabelas da base.' }));
      var caixa = el('div', { classe: 'tabela-envoltorio' }); carregando(caixa); c.appendChild(caixa);
      chamar('statusBase').then(function (d) {
        var tbody = el('tbody');
        d.tabelas.forEach(function (t) {
          tbody.appendChild(el('tr', {}, [
            el('td', {}, [el('strong', { texto: t.nome }), el('small', { texto: t.descricao })]),
            el('td', { texto: t.planilha === 'MOTORISTAS' ? '🔒 Restrita' : 'Base' }),
            el('td', { classe: 'num', texto: numeroBR(t.registros) }),
            el('td', {}, [t.erro ? selo(['✖ ' + t.erro, 'erro']) : selo(['✔ ok', 'ok'])])
          ]));
        });
        caixa.innerHTML = '';
        caixa.appendChild(el('table', {}, [el('thead', {}, [el('tr', {}, ['Tabela', 'Planilha', 'Registros', 'Situação'].map(function (h) { return el('th', { texto: h }); }))]), tbody]));
      }).catch(function (e) { caixa.innerHTML = ''; mostrarErro(e.message, caixa); });
    }

    // ------------------------------------------------------------ veículos
    function nomeFilial(cnpj) {
      var f = (estado.veic.filiais || []).filter(function (x) { return x.cnpj === cnpj; })[0];
      return f ? f.nome_curto : (cnpj || '—');
    }
    function seloIpva(v) {
      if (v.ipva === 'NAO_GERADO' && v.categoria === 'IMPLEMENTO') return selo(['Não tributado', 'mudo']);
      return selo(ROTULOS.IPVA[v.ipva] || [v.ipva, 'mudo']);
    }
    function filtrarVeiculos() {
      var f = estado.filtrosVeic, q = semAcento(f.q).trim(), qPlaca = Core.placa.normalizarPlaca(f.q);
      return estado.veic.veiculos.filter(function (v) {
        if (f.uf && v.uf_registro !== f.uf) return false;
        if (f.filial && v.cnpj_proprietario !== f.filial) return false;
        if (f.tipo && v.tipo !== f.tipo) return false;
        if (f.situacao && v.situacao !== f.situacao) return false;
        if (f.alerta === 'IPVA_VENCIDO' && v.ipva !== 'VENCIDO') return false;
        if (f.alerta === 'LIC_VENCIDO' && v.licenciamento !== 'VENCIDO') return false;
        if (f.alerta === 'LOCADOS' && v.situacao !== 'LOCADO_TERCEIRO') return false;
        if (q) {
          var alvo = semAcento([v.placa, v.renavam, v.marca_modelo, v.locatario, v.veiculo_id].join(' '));
          if (!(qPlaca && v.placa_norm === qPlaca) && alvo.indexOf(q) < 0) return false;
        }
        return true;
      });
    }
    function telaVeiculos() {
      var c = conteudo();
      c.appendChild(el('h1', { texto: '🚛 Veículos' }));
      var sub = el('p', { classe: 'subtitulo', texto: 'Carregando…' }); c.appendChild(sub);
      var area = el('div'); c.appendChild(area);
      chamar('listarVeiculos').then(function (d) {
        estado.veic = d;
        sub.textContent = d.veiculos.length + ' veículos · situação documental do exercício ' + d.exercicio + ' (hoje, ' + dataBR(d.hoje) + ')';
        desenharVeiculos(area);
      }).catch(function (e) { sub.textContent = ''; mostrarErro(e.message, area); });
    }
    function desenharVeiculos(area) {
      area.innerHTML = '';
      var f = estado.filtrosVeic, d = estado.veic;
      var tabelaArea = el('div');
      function redesenhar() { desenharTabelaVeiculos(tabelaArea); }
      function filtro(chave, controle) { controle.addEventListener('input', function () { f[chave] = controle.value; redesenhar(); }); return controle; }
      var barra = el('div', { classe: 'barra' }, [
        filtro('q', el('input', { type: 'search', placeholder: 'Placa (qualquer formato), RENAVAM, modelo, locatário', valor: f.q })),
        filtro('uf', opcoes(el('select'), [['', 'Todas as UFs']].concat(['PR', 'SP', 'SC', 'GO', 'RO', 'MT']), f.uf)),
        filtro('filial', opcoes(el('select'), [['', 'Todas as filiais']].concat(d.filiais.map(function (x) { return [x.cnpj, x.nome_curto]; })), f.filial)),
        filtro('tipo', opcoes(el('select'), [['', 'Todos os tipos']].concat(d.enums.TIPO_VEICULO), f.tipo)),
        filtro('situacao', opcoes(el('select'), [['', 'Todas as situações']].concat(d.enums.SITUACAO_VEICULO.map(function (s) { return [s, ROTULOS.SITUACAO[s] || s]; })), f.situacao)),
        filtro('alerta', opcoes(el('select'), [['', 'Sem filtro de alerta'], ['IPVA_VENCIDO', 'IPVA vencido'], ['LIC_VENCIDO', 'Licenciamento vencido'], ['LOCADOS', 'Só locados']], f.alerta)),
        el('span', { classe: 'espaco' }),
        d.podeEditar ? el('button', { classe: 'botao primario', texto: '+ Novo veículo', onclick: function () { abrirFormVeiculo(null); } }) : null
      ]);
      area.appendChild(barra);
      area.appendChild(tabelaArea);
      redesenhar();
    }
    function desenharTabelaVeiculos(alvo) {
      alvo.innerHTML = '';
      var lista = filtrarVeiculos();
      alvo.appendChild(el('div', { classe: 'totais' }, [el('span', {}, [el('strong', { texto: String(lista.length) }), ' veículo(s)'])]));
      var tbody = el('tbody');
      lista.slice(0, 500).forEach(function (v) {
        tbody.appendChild(el('tr', { classe: 'clicavel', onclick: function () { abrirFichaVeiculo(v.veiculo_id); } }, [
          el('td', {}, [placa(v.placa), el('small', { texto: v.veiculo_id })]),
          el('td', {}, [document.createTextNode(v.tipo || '—'), el('small', { texto: v.marca_modelo || '' })]),
          el('td', {}, [document.createTextNode(nomeFilial(v.cnpj_proprietario)), el('small', { texto: v.uf_registro })]),
          el('td', {}, [document.createTextNode(ROTULOS.SITUACAO[v.situacao] || v.situacao), v.locatario ? el('small', { texto: v.locatario }) : null]),
          el('td', {}, [seloIpva(v)]),
          el('td', {}, [selo(ROTULOS.LIC[v.licenciamento] || [v.licenciamento, 'mudo'])])
        ]));
      });
      alvo.appendChild(el('div', { classe: 'tabela-envoltorio' }, [el('table', {}, [
        el('thead', {}, [el('tr', {}, ['Placa', 'Tipo', 'Filial', 'Situação', 'IPVA ' + estado.veic.exercicio, 'Licenciamento ' + estado.veic.exercicio].map(function (h) { return el('th', { texto: h }); }))]),
        tbody
      ])]));
      if (lista.length > 500) alvo.appendChild(el('p', { classe: 'mudo', texto: 'Mostrando 500 de ' + lista.length + '. Use os filtros.' }));
    }
    function abrirFichaVeiculo(id) {
      abrirGaveta('Carregando…', '', el('p', { classe: 'mudo', texto: 'Buscando o veículo…' }), []);
      chamar('fichaVeiculo', { veiculo_id: id }).then(function (d) {
        var v = d.veiculo;
        var kv = el('dl', { classe: 'kv' });
        [['RENAVAM', v.renavam], ['Chassi', v.chassi], ['Tipo', v.tipo + ' (' + (v.categoria || '') + ')'], ['Marca/modelo', v.marca_modelo],
          ['Ano', [v.ano_fabricacao, v.ano_modelo].filter(Boolean).join('/')], ['Filial', nomeFilial(v.cnpj_proprietario) + ' · ' + (v.cnpj_proprietario || '')],
          ['UF de registro', v.uf_registro], ['Situação', ROTULOS.SITUACAO[v.situacao] || v.situacao], ['Isento de IPVA', v.isento_ipva === 'S' ? 'Sim (' + (v.motivo_isencao || '') + ')' : 'Não'],
          ['Forma de pgto. IPVA', v.forma_pgto_ipva_padrao || 'padrão da CONFIG'], ['Venda/baixa', dataBR(v.data_venda)], ['Observações', v.observacoes]
        ].forEach(function (p) { kv.appendChild(el('div', {}, [el('dt', { texto: p[0] }), el('dd', { texto: p[1] === null || p[1] === undefined || p[1] === '' ? '—' : String(p[1]) })])); });
        var obr = el('ul', { classe: 'lista-simples' });
        if (!d.obrigacoes.length) obr.appendChild(el('li', { classe: 'mudo', texto: 'Nenhuma obrigação gerada.' }));
        d.obrigacoes.forEach(function (o) {
          obr.appendChild(el('li', {}, [
            el('span', {}, [el('strong', { texto: o.tributo + ' ' + o.exercicio + ' · ' + Core.obrigacoes.rotuloParcela(o.parcela) }), el('small', { texto: 'Vence ' + dataBR(o.vencimento) + (o.nr_lancamento_erp ? ' · ' + o.nr_lancamento_erp : '') })]),
            el('span', {}, [document.createTextNode(moeda(o.valor) + (o.camada ? ' (' + o.camada.toLowerCase() + ') ' : ' ')), selo([ROTULOS.STATUS[o.status] || o.status, o.status.indexOf('PAGO') === 0 ? 'ok' : (ROTULOS.PRAZO[o.situacao_prazo] || ['', 'mudo'])[1]])])
          ]));
        });
        var loc = el('ul', { classe: 'lista-simples' });
        if (!d.locacoes.length) loc.appendChild(el('li', { classe: 'mudo', texto: 'Sem locações registradas.' }));
        d.locacoes.forEach(function (l) {
          loc.appendChild(el('li', {}, [el('span', {}, [el('strong', { texto: l.locatario }), el('small', { texto: (l.contrato_ref || '') })]), el('span', { texto: dataBR(l.inicio) + ' → ' + (l.fim ? dataBR(l.fim) : 'vigente') })]));
        });
        var corpo = el('div', {}, [
          el('div', { classe: 'secao' }, [el('h3', { texto: 'Cadastro' }), kv]),
          el('div', { classe: 'secao' }, [el('h3', { texto: 'Obrigações' }), obr]),
          el('div', { classe: 'secao' }, [el('h3', { texto: 'Locações (painel de locação)' }), loc])
        ]);
        var botoes = podeEditar() ? [
          el('button', { classe: 'botao', texto: 'Editar', onclick: function () { abrirFormVeiculo(v); } }),
          el('button', { classe: 'botao', texto: 'Transferir', onclick: function () { abrirTransferir(v); } }),
          ['VENDIDO', 'BAIXADO'].indexOf(v.situacao) < 0 ? el('button', { classe: 'botao perigo', texto: 'Vender / baixar', onclick: function () { abrirVender(v); } }) : null
        ] : [];
        abrirGaveta(Core.placa.formatarPlaca(v.placa), v.veiculo_id + ' · ' + (v.tipo || ''), corpo, botoes);
      }).catch(function (e) { abrirGaveta('Erro', '', el('div', { classe: 'caixa erro', texto: e.message }), []); });
    }
    function abrirFormVeiculo(v) {
      var novo = !v; v = v || { situacao: 'OPERACAO_PROPRIA', tipo: '', isento_ipva: 'N' };
      var d = estado.veic;
      var form = el('form', { classe: 'form', onsubmit: function (e) { e.preventDefault(); } });
      var dicaPlaca = el('p', { classe: 'dica' }), dicaRen = el('p', { classe: 'dica' });
      var inPlaca = entrada('placa', v.placa, { required: true, autocomplete: 'off', style: 'text-transform:uppercase' });
      var inRen = entrada('renavam', v.renavam, { inputmode: 'numeric', autocomplete: 'off' });
      function outros() { return d.veiculos.filter(function (x) { return x.veiculo_id !== v.veiculo_id; }); }
      function checarPlaca() {
        var val = inPlaca.value, fmt = Core.placa.formatoPlaca(val), n = Core.placa.normalizarPlaca(val);
        if (!val) { dicaPlaca.textContent = ''; return; }
        if (!fmt) { dicaPlaca.className = 'dica erro'; dicaPlaca.textContent = 'Formato inválido (ABC1234 ou ABC1D23)'; return; }

        PAGAMENTO: 'placa ; tributo ; parcela ; valor pago ; data ; nº MTO (opcional)\nEx.: BEU1D91;IPVA;U;1.950,00;10/01/2027;MTO 421779'
      };
      var tipo = 'GUIA';
      var dica = el('pre', { classe: 'caixa', style: 'white-space:pre-wrap;margin:0;font-size:12px', texto: ajuda.GUIA });
      var ta = el('textarea', { placeholder: 'Cole aqui as linhas (pode copiar direto do Excel ou do Sheets). Parcela: U = cota única, ou 1 a 5. Tributo: IPVA ou LIC.' });
      var resultado = el('div');
      var radios = el('div', { classe: 'opcoes', style: 'grid-auto-flow:column;justify-content:start;gap:16px' }, [['GUIA', 'Valores de guia'], ['MTO', 'Nº MTO (ERP)'], ['PAGAMENTO', 'Pagamentos']].map(function (t) {
        var r = el('input', { type: 'radio', name: 'tipoLote', value: t[0], checked: t[0] === 'GUIA', onchange: function () { tipo = t[0]; dica.textContent = ajuda[tipo]; resultado.innerHTML = ''; } });
        return el('label', {}, [r, el('span', { texto: t[1] })]);
      }));
      var aplicar = el('button', { classe: 'botao primario', texto: 'Aplicar', disabled: true });
      function previa() {
        resultado.innerHTML = ''; carregando(resultado, 'Conferindo as linhas…');
        chamar('previaLote', { tipo: tipo, texto: ta.value, exercicio: estado.obr.exercicio }).then(function (p) {
          resultado.innerHTML = '';
          resultado.appendChild(el('div', { classe: 'caixa ' + (p.comErro ? 'alerta' : 'ok'), texto: p.validos + ' linha(s) válida(s) · ' + p.comErro + ' com erro' + (p.comErro ? ' (serão ignoradas ao aplicar)' : '') }));
          var tbody = el('tbody');
          p.itens.forEach(function (i) {
            tbody.appendChild(el('tr', {}, [el('td', { texto: String(i.linha) }), el('td', { texto: [i.placa, i.tributo, i.parcela].join(' · ') }),
              el('td', {}, [i.erro ? selo(['✖ ' + i.erro, 'erro']) : selo(['✔ ' + (ROTULOS.STATUS[i.patch.status] || i.patch.status), 'ok']), i.aviso ? el('small', { texto: i.aviso }) : null])]));
          });
          resultado.appendChild(el('div', { classe: 'tabela-envoltorio' }, [el('table', {}, [el('thead', {}, [el('tr', {}, ['Linha', 'Obrigação', 'Resultado'].map(function (h) { return el('th', { texto: h }); }))]), tbody])]));
          aplicar.disabled = !p.validos;
          aplicar.textContent = 'Aplicar ' + p.validos + ' linha(s)';
        }).catch(function (e) { resultado.innerHTML = ''; resultado.appendChild(el('div', { classe: 'caixa erro', texto: e.message })); });
      }
      aplicar.addEventListener('click', function () {
        aplicar.disabled = true;
        chamar('aplicarLote', { tipo: tipo, texto: ta.value, exercicio: estado.obr.exercicio }).then(function (r) {
          toast(r.aplicados + ' obrigação(ões) atualizada(s)' + (r.ignorados ? ' · ' + r.ignorados + ' linha(s) com erro ignorada(s)' : ''));
          fecharGaveta(); telaObrigacoes(estado.obr.exercicio);
        }).catch(function (e) { aplicar.disabled = false; resultado.appendChild(el('div', { classe: 'caixa erro', texto: e.message })); });
      });
      abrirGaveta('Colar em lote', 'Exercício ' + estado.obr.exercicio, el('div', { style: 'display:grid;gap:12px' }, [radios, dica, el('label', { classe: 'campo' }, [ta]), resultado]), [
        el('button', { classe: 'botao', texto: 'Cancelar', onclick: fecharGaveta }), el('button', { classe: 'botao', texto: 'Pré-visualizar', onclick: previa }), aplicar
      ]);
    }

    // ------------------------------------------------------------ roteamento
    function rotear() {
      var id = (location.hash || '#/visao-geral').replace('#/', '');
      var t = telasPermitidas().filter(function (x) { return x.id === id; })[0] || telasPermitidas()[0];
      montarMenu(t.id);
      fecharGaveta();
      document.getElementById('lateral').classList.remove('aberta');
      if (t.id === 'visao-geral') telaVisaoGeral();
      else if (t.id === 'admin') telaAdmin();
      else if (t.id === 'veiculos') telaVeiculos();
      else if (t.id === 'ipva-licenciamento') telaObrigacoes();
      else telaEmConstrucao(t);
      document.getElementById('conteudo').focus();
    }

    document.getElementById('menuBotao').addEventListener('click', function () {
      var nav = document.getElementById('lateral');
      var aberta = nav.classList.toggle('aberta');
      this.setAttribute('aria-expanded', aberta ? 'true' : 'false');
    });

    chamar('meuPerfil').then(function (eu) {
      estado.eu = eu; estado.perfil = eu.perfil;
      document.getElementById('usuario').textContent = eu.email + ' · ' + eu.perfil;
      window.addEventListener('hashchange', rotear);
      rotear();
    }).catch(function (e) {
      document.getElementById('usuario').textContent = '';
      mostrarErro(e.message);
    });
  })();
</script>
